<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Gerador de Senhas</title>
        <meta name="keywords" content="gerar, senha, dificil, grande">
        <meta name="description" content="Gerador de senhas grandes e complexas.">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:ital,wght@0,100..700;1,100..700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined">
        <link rel="stylesheet" href="style.css">
        <script defer src="https://projetos-para-portfolio.vercel.app/gerador-de-senhas/script.js"></script>
    </head>
    <body>
        <header>
            <span class="material-symbols-outlined">shield_lock</span>
            <h1>Gerador de Senhas //</h1>
        </header>
        <main>
            <section class="container-input">
                <p>Selecione o tamanho da senha</p>
                <h2>Atualmente: <span id="valor"></span> Caracteres</h2>
                <input id="slider" class="slider" type="range" min="8" max="128" value="8"/>
                <button id="button" class="button-cta" onclick="generatePassword()">Gerar senha</button>
            </section>    
            <section id="container-password" onclick="copyPassword()" class="container-password hide">
                <span class="title">Senha Gerada! Clique para copiar</span>
                <span id="password"  class="password"></span>
            </section>
        </main>
    </body>
</html>
